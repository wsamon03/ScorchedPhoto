org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Lets `:terrain`/`:engine` (plain kotlin("jvm") modules) build and test without ever
# configuring the `:app` project, so they work in environments with no Android SDK /
# no access to Google's Maven repo (AGP itself can't resolve there).
org.gradle.configureondemand=true
