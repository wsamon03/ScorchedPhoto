name: Build Debug APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run pure-logic unit tests
        run: ./gradlew :terrain:test :engine:test --no-daemon

      - name: Build debug APK
        # --no-configure-on-demand: gradle.properties turns configure-on-demand on so
        # :terrain/:engine (kotlin("jvm") modules) never need AGP resolvable - useful in
        # sandboxes without Google Maven access, irrelevant here, and configure-on-demand
        # is suspected of causing the "decorated class ... BaseVariant" plugin-application
        # failure seen in prior runs regardless of which Kotlin/AGP/Gradle versions were
        # used (the one constant across every failed attempt).
        run: ./gradlew :app:assembleDebug --no-daemon --no-configure-on-demand

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scorched-photo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
