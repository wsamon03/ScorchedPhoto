name: Build Debug APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Ruling out cache corruption: this branch has now been built with three
          # different AGP/Kotlin/Gradle combinations in a row, all hitting the identical
          # "decorated class ... BaseVariant" failure regardless of the actual version
          # change - forcing a fully clean ~/.gradle checks whether a stale/corrupted
          # cached artifact transform from an earlier attempt is what's actually at fault.
          cache-disabled: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run pure-logic unit tests
        run: ./gradlew :terrain:test :engine:test --no-daemon

      - name: Dump buildscript/plugin classpath (diagnostic)
        if: always()
        run: ./gradlew :app:buildEnvironment --no-daemon --no-configure-on-demand
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --no-configure-on-demand --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scorched-photo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
